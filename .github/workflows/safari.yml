name: Safari compatibility

on:
  push:
    branches: ["safari/**"]
  pull_request:
    branches: ["safari/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test --watchAll=false --maxWorkers=2
        env:
          CI: "true"
      - run: pnpm build:safari-output
      - uses: actions/upload-artifact@v4
        with:
          name: safari-web-extension-unsigned
          path: build/safari
          retention-days: 14
